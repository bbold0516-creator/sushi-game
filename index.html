<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sushi Game - 自然な音声読み上げ対応版</title>
    <style>
        /* ==========================================
           1. デザインテーマ（CSS変数）
           ========================================== */
        :root {
            --bg-color: #f5ebe0; 
            --panel-bg: #4e342e;
            --panel-text: #ffffff;
            --btn-primary: #d32f2f;
            --btn-hover: #c62828;
            --belt-bg: #2a2d32;
            --belt-line1: #22252a;
            --belt-line2: #3a3e45;
            --guard-color: #b0bec5;
            --text-color: #3e2723;
        }

        body.theme-wood {
            --bg-color: #f5ebe0;
            --panel-bg: #5d4037;
            --panel-text: #fff;
            --btn-primary: #8d6e63;
            --btn-hover: #6d4c41;
            --belt-bg: #5d4037;
            --belt-line1: #4e342e;
            --belt-line2: #795548;
            --guard-color: #d7ccc8;
            --text-color: #3e2723;
        }

        body.theme-neon {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --panel-text: #66fcf1;
            --btn-primary: #d500f9;
            --btn-hover: #aa00ff;
            --belt-bg: #1f2833;
            --belt-line1: #0b0c10;
            --belt-line2: #45a29e;
            --guard-color: #66fcf1;
            --text-color: #66fcf1;
        }

        body.theme-gold {
            --bg-color: #212121;
            --panel-bg: #212121;
            --panel-text: #ffd700;
            --btn-primary: #b71c1c;
            --btn-hover: #c62828;
            --belt-bg: #b71c1c;
            --belt-line1: #c62828;
            --belt-line2: #e53935;
            --guard-color: #ffd700;
            --text-color: #ffd700;
        }

        /* 画面全体の基本スタイル */
        body {
            margin: 0; padding: 0; overflow: hidden; 
            background-color: var(--bg-color); height: 100vh;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            transition: background-color 0.5s ease; color: var(--text-color);
        }

        .screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; transition: opacity 0.3s;
        }
        .hidden { opacity: 0; pointer-events: none; z-index: -1; }

        /* ==========================================
           2. 共通背景レイヤー & ホーム画面専用「寿」
           ========================================== */
        #background-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        #home-kanji-bg {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: min(70vw, 70vh);
            font-family: 'STKaiti', 'Kaiso', 'Yu Mincho', 'Hiragino Mincho ProN', 'Baskerville', serif;
            font-weight: 900;
            color: rgba(62, 39, 35, 0.08);
            z-index: 5;
            display: none;
            user-select: none;
            line-height: 1;
        }
        body.theme-neon #home-kanji-bg, body.theme-gold #home-kanji-bg {
            color: rgba(255, 255, 255, 0.06);
        }

        .conveyor-belt {
            position: absolute; top: 50%; left: 0; width: 100%; height: 200px;
            transform: translateY(-50%); background-color: var(--belt-bg);
            background-image: repeating-linear-gradient(90deg, var(--belt-line1) 0px, var(--belt-line1) 40px, var(--belt-line2) 40px, var(--belt-line2) 45px);
            border-top: 12px solid var(--guard-color); border-bottom: 12px solid var(--guard-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: all 0.5s ease;
            animation: beltMove 1s linear infinite;
            z-index: 8;
        }
        @keyframes beltMove { from { background-position: 0 0; } to { background-position: -45px 0; } }

        /* ==========================================
           3. UI・ボタンスタイル
           ========================================== */
        .btn {
            background-color: var(--btn-primary); color: white; border: none; padding: 16px 35px;
            font-size: 22px; font-weight: bold; border-radius: 40px; cursor: pointer;
            margin: 8px; box-shadow: 0 6px 15px rgba(0,0,0,0.25); transition: all 0.2s;
        }
        .btn:hover:not(:disabled) { background-color: var(--btn-hover); transform: scale(1.05); }
        .btn:active:not(:disabled) { transform: scale(0.95); }
        .btn:disabled { background-color: #9e9e9e; cursor: not-allowed; opacity: 0.8; transform: none; box-shadow: none; }
        
        .btn-store { background-color: #d32f2f; } 
        .btn-store:hover { background-color: #c62828; }
        .btn-stage { background-color: #d32f2f; } 
        .btn-stage:hover { background-color: #c62828; }
        .btn-zukan { background-color: #c2185b; }
        .btn-zukan:hover { background-color: #ad1457; }
        
        #goto-setting-btn {
            position: absolute;
            bottom: 25px;
            right: 25px;
            background-color: #4e342e;
            padding: 14px 28px;
            font-size: 18px;
            z-index: 150;
        }
        #goto-setting-btn:hover { background-color: #3e2723; }

        .btn-back { background-color: #757575; } 
        .btn-back:hover { background-color: #616161; }

        .home-title-card {
            background-color: var(--panel-bg);
            color: var(--panel-text);
            padding: 30px 60px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            margin-bottom: 25px;
            border: 2px solid rgba(255,255,255,0.15);
            position: relative;
            z-index: 20;
        }
        .title { font-size: 64px; font-weight: 900; margin: 0 0 5px 0; letter-spacing: 2px; }
        .subtitle { font-size: 20px; font-weight: bold; opacity: 0.9; margin: 0; }

        .home-mascot {
            width: 130px;
            height: 80px;
            margin: 0 auto 10px auto;
            animation: mascotFloat 2s infinite ease-in-out alternate;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.25));
        }
        @keyframes mascotFloat {
            0% { transform: translateY(0) rotate(-2deg); }
            100% { transform: translateY(-10px) rotate(2deg); }
        }

        /* ==========================================
           4. パネル共通スタイル & 入力フォーム
           ========================================== */
        .panel {
            background-color: var(--panel-bg); color: var(--panel-text);
            padding: 30px 40px; border-radius: 25px;
            text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3); 
            transform: translateY(-20px); width: 480px;
            border: 2px solid rgba(255,255,255,0.15);
        }

        .panel-zukan {
            width: 650px;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
        }

        .zukan-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 5px;
            margin-bottom: 15px;
        }

        .zukan-item {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 10px 18px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .zukan-item:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        .zukan-emoji { width: 12%; text-align: center; font-size: 24px; }
        .zukan-en { font-weight: bold; color: #ffccbc; width: 32%; text-align: left; }
        .zukan-ja { font-weight: bold; width: 30%; text-align: center; }
        .zukan-ro { opacity: 0.85; width: 26%; text-align: right; font-size: 16px; }
        
        .zukan-header {
            display: flex;
            justify-content: space-between;
            padding: 0 18px 8px 18px;
            font-weight: bold;
            font-size: 15px;
            opacity: 0.8;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 8px;
        }
        
        .high-score-display { font-size: 20px; font-weight: bold; color: #ffccbc; margin-bottom: 15px; }

        .selection-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; max-height: 320px; overflow-y: auto; padding-right: 5px; }
        .selection-btn { 
            padding: 12px 14px; font-size: 17px; border-radius: 15px; border: none; 
            font-weight: bold; color: white; background-color: #d32f2f; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
            position: relative;
        }
        .selection-btn.active { box-shadow: 0 0 0 4px #ffffff inset; }
        .selection-btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
        .stage-btn-sub { font-size: 13px; opacity: 0.85; font-weight: normal; }

        .custom-stage-btn { background-color: #00796b !important; }
        .custom-stage-btn:hover { background-color: #004d40 !important; }
        
        .delete-stage-btn {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.3); border: none; color: #ff8a80;
            border-radius: 50%; width: 28px; height: 28px; font-size: 14px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .delete-stage-btn:hover { background: #c62828; color: white; }

        /* 入力フォーム用スタイル */
        .form-group {
            text-align: left; margin-bottom: 15px;
        }
        .form-group label {
            display: block; font-size: 15px; font-weight: bold; margin-bottom: 6px; opacity: 0.9;
        }
        .form-input {
            width: 100%; padding: 12px; font-size: 16px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.9);
            box-sizing: border-box; color: #333;
        }
        .form-textarea {
            width: 100%; height: 110px; padding: 12px; font-size: 14px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.9);
            box-sizing: border-box; color: #333; resize: none; font-family: inherit;
        }

        /* ==========================================
           5. ゲーム画面 & チュートリアルオーバーレイ
           ========================================== */
        .target-lane {
            position: absolute; width: 100%; height: 120px; background-color: rgba(255, 255, 255, 0.95);
            display: flex; justify-content: center; align-items: center; font-size: 44px; font-weight: bold; color: #2c3e50; z-index: 20;
            transition: border-color 0.3s;
        }
        #top-lane { top: 0; border-bottom: 6px solid #d32f2f; }
        #bottom-lane { bottom: 0; border-top: 6px solid #d32f2f; }

        @keyframes rainbowBorder {
            0% { border-color: #ff0000; }
            16% { border-color: #ffa500; }
            33% { border-color: #ffff00; }
            50% { border-color: #008000; }
            66% { border-color: #0000ff; }
            83% { border-color: #4b0082; }
            100% { border-color: #ee82ee; }
        }

        .fever-lane #top-lane {
            animation: rainbowBorder 1.5s linear infinite;
        }
        .fever-lane #bottom-lane {
            animation: rainbowBorder 1.5s linear infinite;
        }

        .key-badge { font-size: 22px; background-color: #d32f2f; color: white; padding: 6px 16px; border-radius: 16px; margin-right: 20px; }

        #header-info { position: absolute; top: 135px; left: 30px; right: 30px; display: flex; justify-content: space-between; z-index: 20; pointer-events: none; }
        .info-card { font-size: 24px; font-weight: bold; color: #fff; background-color: var(--panel-bg); padding: 10px 20px; border-radius: 20px; box-shadow: 0 6px 12px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.2); }

        #sushi-container { position: absolute; top: 50%; transform: translateY(-50%); text-align: center; white-space: nowrap; transition: top 0.25s, opacity 0.25s; z-index: 15; }
        #sushi-container.move-top { top: 60px !important; opacity: 0; }
        #sushi-container.move-bottom { top: calc(100% - 60px) !important; opacity: 0; }

        #sushi-word { font-size: 48px; font-weight: bold; color: #222; background-color: #ffffff; padding: 12px 36px; border-radius: 30px; border: 3px solid #d32f2f; margin-bottom: 8px; display: inline-block; box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
        #sushi-word ruby { ruby-position: over; }
        #sushi-word rt { font-size: 26px; color: #d32f2f; font-weight: bold; }
        
        .sushi-character-img {
            width: 140px;
            height: 90px;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3));
        }

        #result-message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            font-size: 72px; font-weight: 900; opacity: 0; transition: all 0.2s ease-out; z-index: 100;
            white-space: nowrap;
        }
        #result-message.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        #result-message.success { color: #2e7d32; text-shadow: 0 0 10px white; }
        #result-message.miss { color: #d32f2f; text-shadow: 0 0 10px white; }

        @keyframes rainbowText {
            0% { color: #ff0000; text-shadow: 0 0 15px #ff0000, 0 0 25px #ffffff; }
            16% { color: #ffa500; text-shadow: 0 0 15px #ffa500, 0 0 25px #ffffff; }
            33% { color: #ffff00; text-shadow: 0 0 15px #ffff00, 0 0 25px #ffffff; }
            50% { color: #008000; text-shadow: 0 0 15px #008000, 0 0 25px #ffffff; }
            66% { color: #0000ff; text-shadow: 0 0 15px #0000ff, 0 0 25px #ffffff; }
            83% { color: #4b0082; text-shadow: 0 0 15px #4b0082, 0 0 25px #ffffff; }
            100% { color: #ee82ee; text-shadow: 0 0 15px #ee82ee, 0 0 25px #ffffff; }
        }
        #result-message.fever-rainbow {
            animation: rainbowText 0.8s linear infinite;
        }

        #tutorial-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65); z-index: 150;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.3s ease;
        }
        #tutorial-overlay.hidden { opacity: 0; pointer-events: none; z-index: -1; }
        #tutorial-hand {
            font-size: 70px;
            animation: handBounce 1s infinite alternate ease-in-out;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.4));
            margin-bottom: 5px;
        }
        @keyframes handBounce {
            0% { transform: translateY(-15px); }
            100% { transform: translateY(15px); }
        }
        #tutorial-box {
            background: var(--panel-bg); color: var(--panel-text); padding: 30px 45px; border-radius: 25px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.2);
            position: relative;
        }
        #tutorial-text {
            font-size: 22px; font-weight: bold; margin-bottom: 10px;
        }
        #tutorial-sub-text {
            font-size: 13px; opacity: 0.75; margin-bottom: 20px;
        }

        .tutorial-mascot {
            width: 90px;
            height: 60px;
            margin-bottom: 10px;
        }

        /* ==========================================
           6. ゲーム終了モーダル
           ========================================== */
        #game-over-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #game-over-modal.show { opacity: 1; pointer-events: auto; }
        .modal-content { background: var(--panel-bg); color: var(--panel-text); padding: 50px; border-radius: 30px; text-align: center; border: 2px solid rgba(255,255,255,0.2); }
        .modal-title { font-size: 48px; font-weight: bold; margin-bottom: 10px; }
        .final-score-value { font-size: 72px; font-weight: bold; color: #ffccbc; margin-bottom: 10px; }
        .new-record { color: #ff5252; font-size: 24px; font-weight: bold; margin-bottom: 20px; height: 30px; }
    </style>
</head>
<body class="theme-default">

    <!-- キャラクターテンプレート定義 -->
    <svg style="display: none;">
        <symbol id="sushi-character" viewBox="0 0 200 130">
            <path d="M 25 60 C 20 85, 30 110, 80 115 C 130 120, 175 105, 180 80 C 185 65, 160 55, 130 55 C 80 55, 30 50, 25 60 Z" fill="#FFFBF0" stroke="#5A3214" stroke-width="6" stroke-linejoin="round"/>
            <circle cx="45" cy="85" r="4" fill="#E8DFD0"/>
            <circle cx="65" cy="95" r="5" fill="#E8DFD0"/>
            <circle cx="95" cy="100" r="4" fill="#E8DFD0"/>
            <circle cx="125" cy="95" r="5" fill="#E8DFD0"/>
            <circle cx="155" cy="85" r="4" fill="#E8DFD0"/>
            <circle cx="80" cy="80" r="4" fill="#E8DFD0"/>
            <circle cx="110" cy="82" r="5" fill="#E8DFD0"/>
            <circle cx="140" cy="75" r="4" fill="#E8DFD0"/>
            
            <circle cx="48" cy="82" r="4" fill="#1A1A1A"/>
            <circle cx="68" cy="84" r="4" fill="#1A1A1A"/>
            <path d="M 52 90 Q 58 97 64 90" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>

            <path d="M 15 50 C 10 25, 60 10, 120 15 C 165 20, 190 35, 185 55 C 180 72, 130 75, 70 70 C 25 65, 18 60, 15 50 Z" fill="#FF6B4A" stroke="#5A3214" stroke-width="6" stroke-linejoin="round"/>
            <path d="M 35 45 Q 65 25 115 28 Q 155 30 175 42" fill="none" stroke="#FFA38F" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
            <path d="M 30 55 Q 70 38 125 40 Q 155 42 170 54" fill="none" stroke="#FFA38F" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
            <ellipse cx="80" cy="25" rx="25" ry="6" fill="#FFFFFF" opacity="0.4" transform="rotate(-5 80 25)"/>
        </symbol>
    </svg>

    <!-- 背景 -->
    <div id="background-layer">
        <div id="home-kanji-bg">寿</div>
        <div class="conveyor-belt"></div>
    </div>

    <!-- 1. ホーム画面 -->
    <div id="home-screen" class="screen">
        <div class="home-title-card">
            <svg class="home-mascot"><use href="#sushi-character"/></svg>
            <div class="title">sushi go round</div>
            <div class="subtitle"><span data-i18n="totalBestScore">合計ベストスコア</span>: <span id="home-total-score">0</span></div>
        </div>
        <div style="position: relative; z-index: 20;">
            <button id="goto-stage-btn" class="btn btn-stage" data-i18n="stageBtn">スタート 🎮</button>
            <button id="go-store-btn" class="btn btn-store" data-i18n="storeBtn">マイストア 🛒</button>
            <button id="goto-zukan-btn" class="btn btn-zukan" data-i18n="zukanBtn">図鑑 📖</button>
        </div>
        <button id="goto-setting-btn" class="btn" data-i18n="settingBtn">設定 ⚙️</button>
    </div>

    <!-- 2. ステージ選択画面 -->
    <div id="stage-screen" class="screen hidden">
        <div class="panel">
            <h2 style="margin: 0 0 15px 0; font-size: 28px;" data-i18n="stageSelect">ステージ選択</h2>
            <div id="stage-list-container" class="selection-list"></div>
            <button id="goto-create-stage-btn" class="btn" style="background-color: #2e7d32; font-size: 18px; padding: 12px 30px;" data-i18n="createStageBtn">新規作成 ➕</button>
            <button id="stage-back-btn" class="btn btn-back" style="padding: 12px 30px; font-size: 18px; margin-top: 5px;" data-i18n="backHome">ホームに戻る</button>
        </div>
    </div>

    <!-- 2-B. ステージ新規作成画面 -->
    <div id="create-stage-screen" class="screen hidden">
        <div class="panel" style="width: 500px;">
            <h2 style="margin: 0 0 15px 0; font-size: 26px;" data-i18n="createStageTitle">ステージ新規作成</h2>
            
            <div class="form-group">
                <label data-i18n="stageNameLabel">ステージの名前</label>
                <input type="text" id="custom-stage-name" class="form-input" placeholder="例: 果物ステージ">
            </div>

            <div class="form-group">
                <label data-i18n="wordListLabel">単語リスト (1行に1つの単語ペア)</label>
                <textarea id="custom-stage-words" class="form-textarea" placeholder="日本語, English&#10;例:&#10;もも, Peach&#10;ぶどう, Grape"></textarea>
                <div style="font-size: 12px; opacity: 0.7; margin-top: 4px;" data-i18n="wordListHint">※カンマ(,)で区切って「日本語, 英語」の形式で入力してください。</div>
            </div>

            <button id="save-stage-btn" class="btn" style="background-color: #2e7d32; font-size: 18px; padding: 12px 30px; width: 100%; margin: 10px 0 5px 0;" data-i18n="submitCreateBtn">ステージを作成 🚀</button>
            <button id="create-back-btn" class="btn btn-back" style="padding: 10px 30px; font-size: 16px; width: 100%; margin: 0;" data-i18n="backStageSelect">ステージ選択に戻る</button>
        </div>
    </div>

    <!-- 3. マイストア画面 -->
    <div id="store-screen" class="screen hidden">
        <div class="panel">
            <h2 style="margin: 0 0 10px 0; font-size: 28px;" data-i18n="storeTitle">マイストア</h2>
            <div class="high-score-display"><span data-i18n="totalBestScore">合計ベストスコア</span>: <span id="store-total-score">0</span></div>
            <div id="theme-list-container" class="selection-list"></div>
            <button id="back-home-btn" class="btn btn-back" style="padding: 12px 30px; font-size: 20px; margin-top: 5px;" data-i18n="backHome">ホームに戻る</button>
        </div>
    </div>

    <!-- 4. 図鑑画面 -->
    <div id="zukan-screen" class="screen hidden">
        <div class="panel panel-zukan">
            <h2 style="margin: 0 0 10px 0; font-size: 28px;" data-i18n="zukanTitle">単語図鑑</h2>
            <div class="zukan-header">
                <span class="zukan-emoji" data-i18n="emojiCol">絵文字</span>
                <span class="zukan-en" data-i18n="englishCol">英語 (English)</span>
                <span class="zukan-ja" data-i18n="japaneseCol">日本語</span>
                <span class="zukan-ro" data-i18n="romajiCol">ローマ字</span>
            </div>

                let targetVoice = japaneseVoices.find(v => v.name.includes('Nanami') && v.name.includes('Natural'));

                    targetVoice = japaneseVoices.find(v => v.name.includes('Google 日本語') || v.name.includes('Google Japanese'));
                }

                if (!targetVoice && japaneseVoices.length > 0) {
                    targetVoice = japaneseVoices[0];
                }

                selectedJapaneseVoice = targetVoice || null;
            }

                if (selectedJapaneseVoice) {
                    utterance.voice = selectedJapaneseVoice;

                window.speechSynthesis.speak(utterance);

                    { hiragana: "にく", romaji: "niku", english: "Meat", emoji: "🥩", trivia: "お肉には丈夫な体や筋肉をつくるタンパク質がたっぷり含まれているよ。" },
                    { hiragana: "さかな", romaji: "sakana", english: "Fish", emoji: "🐟", trivia: "魚は川や海を泳いでいて、頭が良くなる栄養成分（DHAなど）がたくさん入っているよ。" },
                    { hiragana: "すし", romaji: "sushi", english: "Sushi", emoji: "🍣", trivia: "お寿司は日本を代表する伝統料理で、今では世界中で大人気なんだよ。" },
                    { hiragana: "らーめん", romaji: "raamen", english: "Ramen", emoji: "🍜", trivia: "ラーメンはスープや麺の種類が豊富で、湯気と一緒にすする美味しさがたまらないね。" },
                    { hiragana: "かれー", romaji: "karee", english: "Curry", emoji: "🍛", trivia: "カレーにはたくさんのスパイスが入っていて、食欲をそそる良い香りが特徴だよ。" },
                    { hiragana: "おにぎり", romaji: "onigiri", english: "Rice ball", emoji: "🍙", trivia: "おにぎりはご飯をギュッと握った日本伝統のファストフードだよ。" },
                    { hiragana: "みかん", romaji: "mikan", english: "Mandarin orange", emoji: "🍊", trivia: "ミカンにはビタミンCがたっぷり入っていて、風邪予防にぴったりの果物だよ。" },
                    { hiragana: "いちご", romaji: "ichigo", english: "Strawberry", emoji: "🍓", trivia: "イチゴの表面にあるツブツブの実は、実は一つひとつが別の果実なんだよ。" },
                    { hiragana: "ぷりん", romaji: "purin", english: "Pudding", emoji: "🍮", trivia: "プリンは卵と牛乳、砂糖を混ぜて蒸し固めた、なめらかな口当たりが人気のデザートだよ。" },
                    { hiragana: "ちょこ", romaji: "choko", english: "Chocolate", emoji: "🍫", trivia: "チョコレートはカカオから作られていて、食べると心がホッと癒されるよ。" },
                    { hiragana: "ぴざ", romaji: "piza", english: "Pizza", emoji: "🍕", trivia: "ピザはイタリア発祥の料理で、丸い生地にチーズや具材を乗せてオーブンで焼き上げるよ。" }
                ]
            }
        ];

        const themes = [
            { id: 'theme-default', unlockScore: 0, color: '#d32f2f' },
            { id: 'theme-wood', unlockScore: 500, color: '#795548' },
            { id: 'theme-neon', unlockScore: 1000, color: '#00BCD4' },
            { id: 'theme-gold', unlockScore: 1500, color: '#FFC107' }
        ];

        // --- 画面要素 ---
        const homeScreen = document.getElementById('home-screen');
        const stageScreen = document.getElementById('stage-screen');
        const createStageScreen = document.getElementById('create-stage-screen');
        const storeScreen = document.getElementById('store-screen');
        const zukanScreen = document.getElementById('zukan-screen');
        const zukanModal = document.getElementById('zukan-modal');
        const settingScreen = document.getElementById('setting-screen');
        const langScreen = document.getElementById('lang-screen');
        const gameScreen = document.getElementById('game-screen');
        const gameOverModal = document.getElementById('game-over-modal');
        const tutorialOverlay = document.getElementById('tutorial-overlay');
        const homeKanjiBg = document.getElementById('home-kanji-bg');

        const homeTotalScore = document.getElementById('home-total-score');
        const storeTotalScore = document.getElementById('store-total-score');
        const newRecordMsg = document.getElementById('new-record-msg');

        function recordWrongWord(word) {
            let wrongWords = JSON.parse(localStorage.getItem('sushiGameWrongWords')) || [];
            if (!wrongWords.some(w => w.hiragana === word.hiragana)) {
                wrongWords.push(word);
                localStorage.setItem('sushiGameWrongWords', JSON.stringify(wrongWords));
            }
        }

        let selectedZukanWord = null;
        function renderZukan() {
            const container = document.getElementById('zukan-list-container');
            container.innerHTML = '';

            let allWordsMap = new Map();
            defaultStagesData.forEach(stage => {
                stage.words.forEach(w => {
                    if (!allWordsMap.has(w.hiragana)) {
                        allWordsMap.set(w.hiragana, w);
                    }
                });
            });

            allWordsMap.forEach(word => {
                const item = document.createElement('div');
                item.className = 'zukan-item';
                item.innerHTML = `
                    <span class="zukan-emoji">${word.emoji || '🍣'}</span>
                    <span class="zukan-en">${word.english}</span>
                    <span class="zukan-ja">${word.hiragana}</span>
                    <span class="zukan-ro">${word.romaji}</span>
                `;
                item.onclick = () => {
                    selectedZukanWord = word;
                    document.getElementById('modal-emoji').textContent = word.emoji || '🍣';
                    document.getElementById('modal-ja').textContent = word.hiragana;
                    document.getElementById('modal-en-ro').textContent = `${word.english} (${word.romaji})`;
                    document.getElementById('modal-trivia').textContent = word.trivia || '豆知識が準備中だよ！';
                    zukanModal.classList.remove('hidden');
                    speakJapanese(word.hiragana);
                };
                container.appendChild(item);
            });
        }

        document.getElementById('modal-speak-btn').addEventListener('click', () => {
            if (selectedZukanWord) speakJapanese(selectedZukanWord.hiragana, true);
        });

        document.getElementById('modal-close-btn').addEventListener('click', () => {
            zukanModal.classList.add('hidden');
        });

        function applyLanguage() {
            const t = i18n[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });

            document.getElementById('lang-ja-btn').classList.toggle('active', currentLang === 'ja');
            document.getElementById('lang-en-btn').classList.toggle('active', currentLang === 'en');
            document.getElementById('modal-speak-btn').textContent = t.speakBtn;
            updateSettingsButtonText();
        }

        function updateSettingsButtonText() {
            const t = i18n[currentLang];
            document.getElementById('toggle-hint-btn').textContent = `${t.hintLabel}: ${showHint ? t.on : t.off}`;
            document.getElementById('toggle-voice-btn').textContent = `${t.voiceLabel}: ${enableVoice ? t.on : t.off}`;
        }

        homeTotalScore.textContent = getTotalBestScore();
        applyLanguage();

        function renderStages() {
            const container = document.getElementById('stage-list-container');
            container.innerHTML = '';
            const t = i18n[currentLang];

            for (let index = 0; index < 5; index++) {
                const btn = document.createElement('button');
                btn.className = `selection-btn btn-stage ${currentStageIndex === index ? 'active' : ''}`;
                const stageName = t.stages[index];
                const stageLabelPrefix = currentLang === 'ja' ? `ステージ ${index + 1}: ` : `Stage ${index + 1}: `;
                const bestScoreForStage = stageHighScores[index] || 0;
                
                btn.innerHTML = `
                    <span>${stageLabelPrefix}${stageName}</span>
                    <span class="stage-btn-sub">${t.bestScoreLabel}${bestScoreForStage}</span>
                `;
                
                btn.onclick = () => {
                    currentStageIndex = index;
                    startGame(); 
                };
                container.appendChild(btn);
            }

            customStages.forEach((customStage, cIndex) => {
                const stageKey = `custom_${customStage.id}`;
                const btn = document.createElement('button');
                btn.className = `selection-btn custom-stage-btn ${currentStageIndex === stageKey ? 'active' : ''}`;
                const bestScore = customStageHighScores[customStage.id] || 0;

                btn.innerHTML = `
                    <span>⭐ ${customStage.name}</span>
                    <span class="stage-btn-sub">${t.bestScoreLabel}${bestScore}</span>
                `;

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-stage-btn';
                delBtn.textContent = '✖';
                delBtn.title = '削除';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (confirm(`「${customStage.name}」を削除しますか？`)) {
                        customStages.splice(cIndex, 1);
                        delete customStageHighScores[customStage.id];
                        localStorage.setItem('sushiGameCustomStages', JSON.stringify(customStages));
                        localStorage.setItem('sushiGameCustomStageScores', JSON.stringify(customStageHighScores));
                        renderStages();
                    }
                };
                btn.appendChild(delBtn);

                btn.onclick = () => {
                    currentStageIndex = stageKey;
                    startGame();
                };

                container.appendChild(btn);
            });
        }

        function renderStore() {
            const totalScore = getTotalBestScore();
            storeTotalScore.textContent = totalScore;
            const container = document.getElementById('theme-list-container');
            container.innerHTML = '';
            const t = i18n[currentLang];

            themes.forEach((theme, index) => {
                const btn = document.createElement('button');
                const requiredTotalScore = theme.unlockScore * 5;
                const isUnlocked = totalScore >= requiredTotalScore;
                const themeName = t.themes[index];
                
                if (isUnlocked) {
                    btn.className = `selection-btn ${activeThemeId === theme.id ? 'active' : ''}`;
                    btn.style.backgroundColor = theme.color;
                    const appliedText = currentLang === 'ja' ? ' (適用中)' : ' (Applied)';
                    const changeText = currentLang === 'ja' ? 'に変更' : ' Apply';
                    btn.textContent = activeThemeId === theme.id ? `✅ ${themeName}${appliedText}` : `✨ ${themeName}${changeText}`;
                    
                    btn.onclick = () => {
                        document.body.className = theme.id;
                        activeThemeId = theme.id;
                        localStorage.setItem('sushiGameTheme', activeThemeId);
                        renderStore();
                    };
                } else {
                    btn.className = 'selection-btn';
                    btn.disabled = true;
                    btn.style.backgroundColor = '#9e9e9e';
                    btn.textContent = `🔒 ${themeName} (${t.unlockLabel}${requiredTotalScore}${t.unlockSuffix})`;
                }
                container.appendChild(btn);
            });
        }

        function showScreen(screen) {
            homeScreen.classList.add('hidden');
            stageScreen.classList.add('hidden');
            createStageScreen.classList.add('hidden');
            storeScreen.classList.add('hidden');
            zukanScreen.classList.add('hidden');
            zukanModal.classList.add('hidden');
            settingScreen.classList.add('hidden');
            langScreen.classList.add('hidden');
            gameScreen.classList.add('hidden');
            gameOverModal.classList.remove('show');
            screen.classList.remove('hidden');

            if (screen === homeScreen) {
                homeKanjiBg.style.display = 'block';
                homeTotalScore.textContent = getTotalBestScore();
            } else {
                homeKanjiBg.style.display = 'none';
            }

            if (screen === stageScreen) renderStages();
            if (screen === storeScreen) renderStore();
            if (screen === zukanScreen) renderZukan();
            if (screen === settingScreen) updateSettingsButtonText();
        }

        showScreen(homeScreen);

        document.getElementById('goto-stage-btn').addEventListener('click', () => showScreen(stageScreen));
        document.getElementById('goto-create-stage-btn').addEventListener('click', () => showScreen(createStageScreen));
        document.getElementById('go-store-btn').addEventListener('click', () => showScreen(storeScreen));
        document.getElementById('goto-zukan-btn').addEventListener('click', () => showScreen(zukanScreen));
        document.getElementById('goto-setting-btn').addEventListener('click', () => showScreen(settingScreen));
        document.getElementById('goto-lang-screen-btn').addEventListener('click', () => showScreen(langScreen));
        
        document.getElementById('stage-back-btn').addEventListener('click', () => showScreen(homeScreen));
        document.getElementById('create-back-btn').addEventListener('click', () => showScreen(stageScreen));
        document.getElementById('back-home-btn').addEventListener('click', () => showScreen(homeScreen));
        document.getElementById('zukan-back-btn').addEventListener('click', () => showScreen(homeScreen));
        document.getElementById('setting-back-btn').addEventListener('click', () => showScreen(homeScreen));
        document.getElementById('lang-back-btn').addEventListener('click', () => showScreen(settingScreen));
        
        document.getElementById('modal-home-btn').addEventListener('click', () => {
            homeTotalScore.textContent = getTotalBestScore();
            showScreen(homeScreen);
        });

        document.getElementById('save-stage-btn').addEventListener('click', () => {
            const nameInput = document.getElementById('custom-stage-name').value.trim();
            const wordsInput = document.getElementById('custom-stage-words').value.trim();

            if (!nameInput) {
                alert('ステージの名前を入力してください。');
                return;
            }
            if (!wordsInput) {
                alert('単語リストを入力してください。');
                return;
            }

            const lines = wordsInput.split('\n');
            const parsedWords = [];

            lines.forEach(line => {
                const parts = line.split(/[,，]/);
                if (parts.length >= 2) {
                    const ja = parts[0].trim();
                    const en = parts[1].trim();
                    if (ja && en) {
                        parsedWords.push({
                            hiragana: ja,
                            romaji: "",
                            english: en,
                            emoji: "🍣"
                        });
                    }
                }
            });

            if (parsedWords.length < 2) {
                alert('単語は少なくとも2つ以上入力してください。（形式: 日本語, 英語）');
                return;
            }

            const newCustomStage = {
                id: Date.now(),
                name: nameInput,
                words: parsedWords
            };

            customStages.push(newCustomStage);
            localStorage.setItem('sushiGameCustomStages', JSON.stringify(customStages));

            document.getElementById('custom-stage-name').value = '';
            document.getElementById('custom-stage-words').value = '';

            alert(`「${nameInput}」ステージを作成しました！`);
            showScreen(stageScreen);
        });

        document.getElementById('toggle-hint-btn').addEventListener('click', () => {
            showHint = !showHint;
            localStorage.setItem('sushiGameHint', showHint);
            updateSettingsButtonText();
        });

        document.getElementById('toggle-voice-btn').addEventListener('click', () => {
            enableVoice = !enableVoice;
            localStorage.setItem('sushiGameVoice', enableVoice);
            updateSettingsButtonText();
        });

        document.getElementById('reset-record-btn').addEventListener('click', () => {
            const t = i18n[currentLang];
            if (confirm(t.resetConfirm)) {
                localStorage.removeItem('sushiGameStageScores');
                localStorage.removeItem('sushiGameCustomStageScores');
                localStorage.removeItem('sushiGameTheme');
                localStorage.removeItem('sushiGameHint');
                localStorage.removeItem('sushiGameVoice');
                localStorage.removeItem('sushiGameWrongWords');
                stageHighScores = [0, 0, 0, 0, 0];
                customStageHighScores = {};
                activeThemeId = 'theme-default';
                showHint = true;
                enableVoice = true;
                document.body.className = activeThemeId;
                homeTotalScore.textContent = getTotalBestScore();
                updateSettingsButtonText();
                alert(t.resetDone);
            }
        });

        document.getElementById('lang-ja-btn').addEventListener('click', () => {
            currentLang = 'ja';
            localStorage.setItem('sushiGameLang', 'ja');
            applyLanguage();
        });
        document.getElementById('lang-en-btn').addEventListener('click', () => {
            currentLang = 'en';
            localStorage.setItem('sushiGameLang', 'en');
            applyLanguage();
        });

        // ==========================================
        // ゲームのロジック
        // ==========================================
        const sushiContainer = document.getElementById('sushi-container');
        const scoreDisplay = document.getElementById('score');
        const timeDisplay = document.getElementById('time');
        const topWord = document.getElementById('top-word');
        const bottomWord = document.getElementById('bottom-word');
        const resultMessage = document.getElementById('result-message');
        const currentStageNameDisplay = document.getElementById('current-stage-name');

        let sushiX = 0, speed = 4, GAME_TIME = 30;
        let timeLeft = GAME_TIME, currentScore = 0;
        let correctLane = "", isProcessing = false, isGameOver = true, timerId = null;
        let activeWordList = [];

        function updateFeverUI() {
            if (feverTurns > 0) {
                gameScreen.classList.add('fever-lane');
            } else {
                gameScreen.classList.remove('fever-lane');
            }
        }

        function startGame() {
            showScreen(gameScreen);
            currentScore = 0;
            timeLeft = GAME_TIME;
            isGameOver = false;
            lastWordIndex = -1;
            successStreak = 0;
            feverTurns = 0;
            updateFeverUI();
            scoreDisplay.textContent = currentScore;
            timeDisplay.textContent = timeLeft;
            newRecordMsg.textContent = "";
            
            const t = i18n[currentLang];

            if (typeof currentStageIndex === 'string' && currentStageIndex.startsWith('custom_')) {
                const cId = parseInt(currentStageIndex.replace('custom_', ''));
                const foundCustom = customStages.find(s => s.id === cId);
                if (foundCustom) {
                    currentStageNameDisplay.textContent = foundCustom.name;
                    activeWordList = foundCustom.words;
                } else {
                    activeWordList = defaultStagesData[0].words;
                }
            } else if (currentStageIndex === 4) {
                currentStageNameDisplay.textContent = t.stages[4];
                let wrongWords = JSON.parse(localStorage.getItem('sushiGameWrongWords')) || [];
                let pool = [...wrongWords];

                let allWords = [];
                for (let i = 0; i < 3; i++) {
                    if(defaultStagesData[i]) {
                        allWords = allWords.concat(defaultStagesData[i].words);
                    }
                }

                let shuffledAll = [...allWords].sort(() => Math.random() - 0.5);

                for (let w of shuffledAll) {
                    if (pool.length >= 18) break;
                    if (!pool.some(item => item.hiragana === w.hiragana)) {
                        pool.push(w);
                    }
                }

                while (pool.length < 18 && allWords.length > 0) {
                    let randW = allWords[Math.floor(Math.random() * allWords.length)];
                    pool.push(randW);
                }

                activeWordList = pool;
            } else if (currentStageIndex === 3) {
                currentStageNameDisplay.textContent = t.stages[3];
                let allWords = [];
                defaultStagesData.forEach(s => allWords = allWords.concat(s.words));
                activeWordList = allWords;
            } else {
                currentStageNameDisplay.textContent = t.stages[currentStageIndex];
                activeWordList = defaultStagesData[currentStageIndex].words;
            }

            if (showHint) {
                isWaitingForTutorial = true;
                tutorialOverlay.classList.remove('hidden');
                showHint = false;
                localStorage.setItem('sushiGameHint', false);
            } else {
                isWaitingForTutorial = false;
                tutorialOverlay.classList.add('hidden');
            }
            
            if (timerId) clearInterval(timerId);
            timerId = setInterval(() => {
                if (isGameOver || isWaitingForTutorial) return;
                timeLeft--;
                timeDisplay.textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);

            setNextQuestion();
        }

        document.getElementById('tutorial-ok-btn').addEventListener('click', () => {
            tutorialOverlay.classList.add('hidden');
            isWaitingForTutorial = false;
        });

        let currentCorrectWord = null;

        function setNextQuestion() {
            if (isGameOver) return;
            sushiContainer.className = "";
            isProcessing = false;

            let correctIndex;
            do {
                correctIndex = Math.floor(Math.random() * activeWordList.length);
            } while (activeWordList.length > 1 && correctIndex === lastWordIndex);
            
            lastWordIndex = correctIndex;
            const correct = activeWordList[correctIndex];
            currentCorrectWord = correct;

            speakJapanese(correct.hiragana);

            let dummyIndex;
            do {
                dummyIndex = Math.floor(Math.random() * activeWordList.length);
            } while (dummyIndex === correctIndex);
            const dummy = activeWordList[dummyIndex];

            document.getElementById('sushi-hiragana').textContent = correct.hiragana;
            document.getElementById('sushi-romaji').textContent = correct.romaji || "";

            const correctEmoji = correct.emoji || '🍣';
            const dummyEmoji = dummy.emoji || '🍣';

            if (Math.random() < 0.5) {
                topWord.textContent = `${correctEmoji} ${correct.english}`;
                bottomWord.textContent = `${dummyEmoji} ${dummy.english}`;
                correctLane = "top";
            } else {
                topWord.textContent = `${dummyEmoji} ${dummy.english}`;
                bottomWord.textContent = `${correctEmoji} ${correct.english}`;
                correctLane = "bottom";
            }

            sushiX = window.innerWidth;
            sushiContainer.style.left = sushiX + 'px';
        }

        function handleSuccess() {
            successStreak++;
            
            let basePoints = 10;
            if (successStreak === 2) basePoints = 30;
            else if (successStreak === 3) basePoints = 50;
            else if (successStreak >= 4) basePoints = 100;

            if (successStreak === 10 && feverTurns === 0) {
                feverTurns = 3;
                timeLeft += 3;
                timeDisplay.textContent = timeLeft;
                updateFeverUI();
            }

            let points = basePoints;
            const isFever = feverTurns > 0;
            if (isFever) {
                points *= 2;
            }

            currentScore += points;
            scoreDisplay.textContent = currentScore;

            const t = i18n[currentLang];
            let msg = isFever ? `${t.fever} (+${points})` : `${t.success} (+${points})`;
            
            showMessage(msg, "success", isFever);

            if (isFever) {
                feverTurns--;
                updateFeverUI();
            }
        }

        function handleMiss() {
            successStreak = 0;
            const t = i18n[currentLang];
            if (currentCorrectWord) {
                recordWrongWord(currentCorrectWord);
            }

            if (feverTurns > 0) {
                showMessage(t.fever, "success", true);
                feverTurns--;
                updateFeverUI();
            } else {
                currentScore = Math.max(0, currentScore - 50);
                showMessage(t.miss, "miss", false);
            }
            scoreDisplay.textContent = currentScore;
        }

        function sortSushi(direction) {
            if (isProcessing || isGameOver || isWaitingForTutorial) return;
            isProcessing = true;
            
            if (direction === correctLane) {
                handleSuccess();
            } else {
                handleMiss();
            }
            
            sushiContainer.classList.add(direction === 'top' ? 'move-top' : 'move-bottom');
            setTimeout(setNextQuestion, 300);
        }

        function showMessage(text, type, isRainbow = false) {
            resultMessage.textContent = text;
            resultMessage.className = `${type} show`;
            if (isRainbow) {
                resultMessage.classList.add('fever-rainbow');
            } else {
                resultMessage.classList.remove('fever-rainbow');
            }
            setTimeout(() => { 
                resultMessage.className = ""; 
            }, 400);
        }

        function endGame() {
            isGameOver = true;
            clearInterval(timerId);
            feverTurns = 0;
            updateFeverUI();
            document.getElementById('final-score').textContent = currentScore;
            const t = i18n[currentLang];
            
            if (typeof currentStageIndex === 'string' && currentStageIndex.startsWith('custom_')) {
                const cId = parseInt(currentStageIndex.replace('custom_', ''));
                if (currentScore > (customStageHighScores[cId] || 0)) {
                    customStageHighScores[cId] = currentScore;
                    localStorage.setItem('sushiGameCustomStageScores', JSON.stringify(customStageHighScores));
                    newRecordMsg.textContent = t.newRecord;
                } else {
                    newRecordMsg.textContent = "";
                }
            } else {
                if (currentScore > (stageHighScores[currentStageIndex] || 0)) {
                    stageHighScores[currentStageIndex] = currentScore;
                    localStorage.setItem('sushiGameStageScores', JSON.stringify(stageHighScores));
                    newRecordMsg.textContent = t.newRecord;
                } else {
                    newRecordMsg.textContent = "";
                }
            }
            
            gameOverModal.classList.add('show');
        }

        function update() {
            if (!isProcessing && !isGameOver && !isWaitingForTutorial) {
                sushiX -= speed;
                const containerWidth = sushiContainer.offsetWidth || 200;
                if (sushiX < -containerWidth) {
                    handleMiss();
                    setNextQuestion();
                } else {
                    sushiContainer.style.left = sushiX + 'px';
                }
            }
            requestAnimationFrame(update);
        }
        update(); 

        window.addEventListener('keydown', (e) => {
            if (isGameOver || isWaitingForTutorial) return;
            if (e.key === 'ArrowUp') { e.preventDefault(); sortSushi('top'); }
            if (e.key === 'ArrowDown') { e.preventDefault(); sortSushi('bottom'); }
        });
    </script>
</body>
</html>
